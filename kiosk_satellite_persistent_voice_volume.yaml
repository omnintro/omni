blueprint:
  name: Kiosk Satellite - Persistent Voice Volume (Event Driven, Multi Satellite / Multi Player)
  description: >-
    Preserves voice-requested media-player volume changes when Kiosk Satellite
    temporarily ducks external speakers and later restores their pre-Assist
    volume.

    This revision is event-driven. Absolute media_player.volume_set calls and
    media-player volume state changes are independent automation triggers, so a
    fast local Assist pipeline cannot slip a volume_set call through a gap in a
    wait_for_trigger loop.

    Select one or more Kiosk/Assist Satellite entities and one or more managed
    media players. The blueprint does not intercept conversation text or
    replace intents, so compound requests and LLM-driven Home Assistant control
    remain available.
  domain: automation
  homeassistant:
    min_version: 2024.6.0

  input:
    assist_satellite:
      name: Assist satellite(s)
      description: >-
        Kiosk Satellite / Assist Satellite entities whose active voice sessions
        should enable deferred volume handling.
      selector:
        entity:
          multiple: true
          filter:
            - domain: assist_satellite

    media_player:
      name: Media player(s)
      description: >-
        External media players whose requested volume changes should survive
        Kiosk Satellite ducking/restoration.
      selector:
        entity:
          multiple: true
          filter:
            - domain: media_player

    processing_guard_ms:
      name: Relative-change processing guard
      description: >-
        Raw volume state changes this soon after a satellite enters processing
        are ignored as possible late ducking updates. This does NOT affect
        absolute media_player.volume_set capture.
      default: 150
      selector:
        number:
          min: 0
          max: 1000
          step: 25
          unit_of_measurement: ms
          mode: slider

    late_relative_grace_ms:
      name: Late relative-change grace
      description: >-
        Allow raw volume changes shortly after the satellite enters responding.
        This catches integrations whose relative-volume state report arrives
        just after intent processing finishes.
      default: 400
      selector:
        number:
          min: 0
          max: 1500
          step: 50
          unit_of_measurement: ms
          mode: slider

    restore_delay_ms:
      name: Kiosk restore delay
      description: >-
        Wait this long after the relevant satellite(s) return to idle before
        replaying a relative volume change. Increase it if Kiosk restores its
        cached volume after this blueprint acts.
      default: 750
      selector:
        number:
          min: 0
          max: 5000
          step: 50
          unit_of_measurement: ms
          mode: slider

    absolute_wins_delay_ms:
      name: Absolute-command priority delay
      description: >-
        Extra delay used only for exact volume_set requests. An absolute command
        also causes a media-player state change, which can look like a relative
        adjustment. Replaying the exact absolute target slightly later ensures
        commands such as "set volume to 10 percent" always win.
      default: 150
      selector:
        number:
          min: 50
          max: 1000
          step: 50
          unit_of_measurement: ms
          mode: slider

    session_timeout_seconds:
      name: Session timeout
      description: >-
        Maximum time a replay run waits for the relevant satellite(s) to return
        to idle.
      default: 60
      selector:
        number:
          min: 10
          max: 180
          step: 5
          unit_of_measurement: s
          mode: slider

mode: parallel
max: 50
max_exceeded: silent

variables:
  satellite_input: !input assist_satellite
  player_input: !input media_player
  satellite_entities: >-
    {{ satellite_input if satellite_input is list else [satellite_input] }}
  player_entities: >-
    {{ player_input if player_input is list else [player_input] }}
  processing_guard_ms_value: !input processing_guard_ms
  late_relative_grace_ms_value: !input late_relative_grace_ms
  restore_delay_ms_value: !input restore_delay_ms
  absolute_wins_delay_ms_value: !input absolute_wins_delay_ms
  session_timeout_seconds_value: !input session_timeout_seconds

triggers:
  # Exact absolute-volume requests. Home Assistant's built-in HassSetVolume
  # uses media_player.volume_set, and LLM Home Assistant control commonly ends
  # up on this same service path.
  - trigger: event
    event_type: call_service
    event_data:
      domain: media_player
      service: volume_set
    id: absolute_volume

  # Native HassSetVolumeRelative may call the media-player entity directly,
  # so raw volume_level state movement is the most general observable signal
  # for relative adjustments.
  - trigger: state
    entity_id: !input media_player
    attribute: volume_level
    id: volume_state_change

conditions: []

actions:
  - choose:
      # ---------------------------------------------------------------------
      # ABSOLUTE VOLUME PATH
      # ---------------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'absolute_volume' }}"
        sequence:
          - variables:
              service_data: "{{ trigger.event.data.get('service_data', {}) }}"
              requested_volume: >-
                {{ trigger.event.data.get('service_data', {}).get('volume_level') }}
              raw_target_ids: >-
                {{ trigger.event.data.get('service_data', {}).get('entity_id', []) }}
              target_ids: >-
                {% set raw = trigger.event.data.get('service_data', {}).get('entity_id', []) %}
                {% if raw == 'all' %}
                  {{ player_entities }}
                {% elif raw is string %}
                  {{ [raw] }}
                {% else %}
                  {{ raw or [] }}
                {% endif %}
              managed_targets: >-
                {% set raw = trigger.event.data.get('service_data', {}).get('entity_id', []) %}
                {% if raw == 'all' %}
                  {{ player_entities }}
                {% else %}
                  {% set ids = [raw] if raw is string else (raw or []) %}
                  {% set ns = namespace(items=[]) %}
                  {% for p in player_entities %}
                    {% if p in ids %}
                      {% set ns.items = ns.items + [p] %}
                    {% endif %}
                  {% endfor %}
                  {{ ns.items }}
                {% endif %}
              processing_satellites: >-
                {% set ns = namespace(items=[]) %}
                {% for s in satellite_entities %}
                  {% if is_state(s, 'processing') %}
                    {% set ns.items = ns.items + [s] %}
                  {% endif %}
                {% endfor %}
                {{ ns.items }}

          # Ignore Kiosk's own duck/restore volume_set calls because those occur
          # outside the selected satellite's processing phase. Also ignore
          # volume_set calls aimed at unmanaged players.
          - condition: template
            value_template: >-
              {{ requested_volume is number
                 and managed_targets | length > 0
                 and processing_satellites | length > 0 }}

          # Wait for every satellite that was processing when this exact
          # request happened to finish its voice interaction.
          - wait_template: >-
              {% set ns = namespace(all_idle=true) %}
              {% for s in processing_satellites %}
                {% if not is_state(s, 'idle') %}
                  {% set ns.all_idle = false %}
                {% endif %}
              {% endfor %}
              {{ ns.all_idle }}
            timeout:
              seconds: "{{ session_timeout_seconds_value | int(60) }}"
            continue_on_timeout: false

          # Let Kiosk restore first. Absolute gets a small EXTRA delay so it is
          # guaranteed to win over any duplicate relative inference caused by
          # the same physical state movement.
          - delay:
              milliseconds: >-
                {{ (restore_delay_ms_value | int(750))
                   + (absolute_wins_delay_ms_value | int(150)) }}

          - repeat:
              for_each: "{{ managed_targets }}"
              sequence:
                - action: media_player.volume_set
                  target:
                    entity_id: "{{ repeat.item }}"
                  data:
                    volume_level: >-
                      {{ [[requested_volume | float(0), 0] | max, 1] | min }}

      # ---------------------------------------------------------------------
      # RELATIVE VOLUME PATH
      # ---------------------------------------------------------------------
      - conditions:
          - condition: template
            value_template: "{{ trigger.id == 'volume_state_change' }}"
        sequence:
          - variables:
              changed_player: "{{ trigger.entity_id }}"
              old_volume: >-
                {{ trigger.from_state.attributes.get('volume_level')
                   if trigger.from_state is not none else none }}
              new_volume: >-
                {{ trigger.to_state.attributes.get('volume_level')
                   if trigger.to_state is not none else none }}
              delta: >-
                {% set old = trigger.from_state.attributes.get('volume_level')
                     if trigger.from_state is not none else none %}
                {% set new = trigger.to_state.attributes.get('volume_level')
                     if trigger.to_state is not none else none %}
                {{ (new - old) if old is number and new is number else none }}

              # Satellites for which this state movement plausibly belongs to
              # an Assist command. Processing is normal. A very recent
              # responding transition is allowed for integrations that report
              # the volume a little late.
              relevant_satellites: >-
                {% set now_ts = as_timestamp(now()) %}
                {% set grace = late_relative_grace_ms_value | float(400) %}
                {% set guard = processing_guard_ms_value | float(150) %}
                {% set ns = namespace(items=[]) %}
                {% for s in satellite_entities %}
                  {% set st = states[s] if states[s] is defined else none %}
                  {% if st is not none %}
                    {% set age_ms = (now_ts - as_timestamp(st.last_changed)) * 1000 %}
                    {% if st.state == 'processing' and age_ms >= guard %}
                      {% set ns.items = ns.items + [s] %}
                    {% elif st.state == 'responding' and age_ms <= grace %}
                      {% set ns.items = ns.items + [s] %}
                    {% endif %}
                  {% endif %}
                {% endfor %}
                {{ ns.items }}

          - condition: template
            value_template: >-
              {{ changed_player in player_entities
                 and old_volume is number
                 and new_volume is number
                 and delta is number
                 and (delta | abs) > 0.0005
                 and relevant_satellites | length > 0 }}

          - wait_template: >-
              {% set ns = namespace(all_idle=true) %}
              {% for s in relevant_satellites %}
                {% if not is_state(s, 'idle') %}
                  {% set ns.all_idle = false %}
                {% endif %}
              {% endfor %}
              {{ ns.all_idle }}
            timeout:
              seconds: "{{ session_timeout_seconds_value | int(60) }}"
            continue_on_timeout: false

          - delay:
              milliseconds: "{{ restore_delay_ms_value | int(750) }}"

          - variables:
              restored_volume: >-
                {% set v = state_attr(changed_player, 'volume_level') %}
                {{ v if v is number else none }}
              final_volume: >-
                {% set v = state_attr(changed_player, 'volume_level') %}
                {% if v is number and delta is number %}
                  {{ [[(v | float) + (delta | float), 0] | max, 1] | min }}
                {% else %}
                  {{ none }}
                {% endif %}

          - condition: template
            value_template: "{{ final_volume is number }}"

          - action: media_player.volume_set
            target:
              entity_id: "{{ changed_player }}"
            data:
              volume_level: "{{ final_volume }}"
